name: Release

on:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: kannaka-hdl-windows-x86_64.exe
          # MUSL static — no glibc dependency, runs on every Linux
          # (same convention as kannaka-crystal / kannaka-memory).
          - target: x86_64-unknown-linux-musl
            os: ubuntu-22.04
            artifact: kannaka-hdl-linux-x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-22.04
            artifact: kannaka-hdl-linux-aarch64
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: kannaka-hdl-macos-x86_64
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: kannaka-hdl-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Set up musl cross toolchain (linux)
        if: contains(matrix.target, 'linux-musl')
        uses: taiki-e/setup-cross-toolchain-action@v1
        with:
          target: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }} --bin kannaka-hdl

      - name: Rename artifact + emit SHA-256 sidecar
        shell: bash
        run: |
          ext=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then ext=".exe"; fi
          cp "target/${{ matrix.target }}/release/kannaka-hdl${ext}" "${{ matrix.artifact }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          else
            shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

      - name: Upload SHA-256 sidecar
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}.sha256
          path: ${{ matrix.artifact }}.sha256

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            kannaka-hdl-windows-x86_64.exe/kannaka-hdl-windows-x86_64.exe
            kannaka-hdl-windows-x86_64.exe.sha256/kannaka-hdl-windows-x86_64.exe.sha256
            kannaka-hdl-linux-x86_64/kannaka-hdl-linux-x86_64
            kannaka-hdl-linux-x86_64.sha256/kannaka-hdl-linux-x86_64.sha256
            kannaka-hdl-linux-aarch64/kannaka-hdl-linux-aarch64
            kannaka-hdl-linux-aarch64.sha256/kannaka-hdl-linux-aarch64.sha256
            kannaka-hdl-macos-x86_64/kannaka-hdl-macos-x86_64
            kannaka-hdl-macos-x86_64.sha256/kannaka-hdl-macos-x86_64.sha256
            kannaka-hdl-macos-aarch64/kannaka-hdl-macos-aarch64
            kannaka-hdl-macos-aarch64.sha256/kannaka-hdl-macos-aarch64.sha256
          generate_release_notes: true
